name: FAVMED Online CI

on:
  push:
    branches:
      - feature/favmed-online-master-login
    paths:
      - "online/**"
      - ".github/workflows/favmed-online.yml"
  pull_request:
    paths:
      - "online/**"
      - ".github/workflows/favmed-online.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-online:
    name: Check and build FAVMED Online
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build application
        run: npm run build
