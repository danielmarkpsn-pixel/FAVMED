name: FAVMED Online CI

on:
  push:
    branches:
      - main
      - feature/favmed-online-master-login
    paths:
      - "online/**"
      - "fila.json"
      - ".github/workflows/favmed-online.yml"
  pull_request:
    paths:
      - "online/**"
      - "fila.json"
      - ".github/workflows/favmed-online.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-online:
    name: Check and build FAVMED Online
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax and security regression guardrails
        run: npm run check
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check --no-lock supabase/functions/master-users/index.ts
      - name: Build application
        run: npm run build
